name: Verify ADRs

# Exécuté sur chaque push et pull request pour vérifier la cohérence des ADR
on: [push, pull_request]

jobs:
  verify:
    name: Verify ADRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make verify-adrs.sh executable
        run: chmod +x scripts/verify-adrs.sh

      - name: Run ADR verification
        run: ./scripts/verify-adrs.sh
