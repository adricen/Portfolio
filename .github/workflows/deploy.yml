name: Build and Deploy

# Exécuté sur chaque push vers main
on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: |
          npm run typecheck
          npm run eslint .

      - name: Run Tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Analyze bundle
        run: npx nuxi analyze

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  lighthouse:
    name: Lighthouse (Post-Deploy)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse on production
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://adricen.github.io/Portfolio/
            https://adricen.github.io/Portfolio/projets
            https://adricen.github.io/Portfolio/taran-core
          uploadArtifacts: true
          configPath: ./.lighthouserc.json
