name: PR Checks

# Exécuté sur chaque pull request
on: [pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run eslint .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  verify-adrs:
    name: Verify ADRs
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make verify-adrs.sh executable
        run: chmod +x scripts/verify-adrs.sh

      - name: Run ADR verification
        run: ./scripts/verify-adrs.sh

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Analyze bundle
        run: npx nuxi analyze

      - name: Check bundle size
        run: |
          # Vérifier que le bundle JS gzippé est < 2 Mo
          BUNDLE_SIZE=$(du -sb .output/public/_nuxt/ | awk '{sum+=$1} END {print sum}')
          BUNDLE_SIZE_KB=$((BUNDLE_SIZE / 1024))
          BUNDLE_SIZE_MB=$(echo "scale=2; $BUNDLE_SIZE_KB / 1024" | bc)
          
          echo "Bundle size: ${BUNDLE_SIZE_MB} Mo"
          
          if (( $(echo "$BUNDLE_SIZE_MB > 2" | bc -l) )); then
            echo "❌ Bundle size exceeds 2 Mo (${BUNDLE_SIZE_MB} Mo)"
            exit 1
          else
            echo "✅ Bundle size is within limit (${BUNDLE_SIZE_MB} Mo < 2 Mo)"
          fi
